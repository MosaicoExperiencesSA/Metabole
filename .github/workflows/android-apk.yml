name: Android APK (debug)

# Compila un APK di debug dell'app Metabole (unica, smistata per ruolo) e lo pubblica
# come artefatto scaricabile. Utile per provare l'app senza dipendere da un Mac locale.
#
# ⛔ **SOLO A MANO** (Actions → questo workflow → Run), dal 26/8. Prima girava anche a ogni push
# su main che toccasse `app/**`, e il 26/8 i minuti Actions del mese sono finiti: i job hanno
# smesso di partire («Run failed at startup: No jobs were run») e cinque check sono stati
# annullati in blocco. Misurato sulla pagina di fatturazione: **Copilot $0**, tutto Actions, e
# **Metabole $22,37 su $32,84** — il 68% del consumo dell'account.
#
# ⚠️ E questo è il job più caro di tutti: SDK Android, Gradle, un APK intero. Girava anche per
# un push che cambiava **solo il numero di versione** in `app/package.json` — cioè a ogni
# rilascio OTA, che con l'APK non c'entra niente. Un artefatto che nessuno scarica, pagato ogni
# volta.
#
# ⚠️ Quello che si perde è poco: l'APK serve **quando lo si vuole provare**, e in quel momento
# si preme «Run workflow». La rete di sicurezza sull'app non è questa — è il job `App · build`
# della CI, che compila e resta a ogni push.

on:
  workflow_dispatch:
  # ⚠️ **UNA VOLTA A SETTIMANA, E NON PER AVERE L'APK.** Togliendo il push si perde una cosa vera:
  # la CI compila il **web** dell'app, non il progetto **nativo** — `cap add android`, le iniezioni
  # (widget, contapassi, push, icona) e Gradle non li attraversa nessuno. Un difetto lì resterebbe
  # nascosto fino alla prossima build per lo store, cioè nel momento peggiore.
  # Un giro a settimana costa ~10 minuti al mese invece di uno a ogni push, e la differenza fra
  # «lo scopro lunedì» e «lo scopro il giorno del rilascio» è tutta.
  # ⚠️ Lunedì alle 04:00 UTC: fuori dall'orario in cui qualcuno aspetta un runner.
  schedule:
    - cron: '0 4 * * 1'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        
      - name: Install dependencies
        run: npm ci

      - name: Build web + genera progetto Android
        # android:init = build + cap add android; poi le iniezioni native
        # (widget home, contapassi, notifiche push, icona Gaia) che vanno eseguite
        # DOPO cap e PRIMA di gradlew — le stesse che gira il build locale (android:sync).
        run: |
          npm run android:init
          npm run android:widget
          npm run android:steps
          npm run android:push
          npm run android:icon
          npm run android:play

      - name: Build APK di debug
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Pubblica l'APK come artefatto
        uses: actions/upload-artifact@v4
        with:
          name: metabole-app-debug
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
